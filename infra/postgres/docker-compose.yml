services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ticketmind_app
      POSTGRES_DB: ticketmind_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/postgres/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ticketmind_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketmind_app -d ticketmind_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  ticketmind_pg:
